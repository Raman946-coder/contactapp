<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Contact Manager Pro</title>
  <link rel="stylesheet" href="design.css">
</head>
<body>

<div class="app-container">
  <div class="section">
    <h2 id="formTitle">New Contact</h2>
    
    <div class="input-group">
      <label>First Name</label>
      <input id="first" placeholder="e.g. Raman">
    </div>

    <div class="input-group">
      <label>Last Name</label>
      <input id="last" placeholder="e.g. Kumar">
    </div>

    <div class="input-group">
      <label>Email Address</label>
      <input id="email" type="email" placeholder="name@example.com">
    </div>

    <div class="input-group">
      <label>Phone Number</label>
      <input id="phone" placeholder="+91 00000 00000">
    </div>

    <button class="btn add-btn" id="submitBtn" onclick="handleFormSubmit()">Add Contact</button>
    <div id="cancelArea"></div>
  </div>

  <div class="section">
    <h2>Directory</h2>
    <input id="search" class="search-box" placeholder="Search names..." onkeyup="loadContacts()">
    <div id="list">
      </div>
  </div>
</div>

<script>
  const API_URL = "http://localhost:3000";
  let editingId = null;

  // Handles both Adding and Updating contacts
  async function handleFormSubmit() {
    const btn = document.getElementById("submitBtn");
    const fields = {
      first_name: document.getElementById("first").value.trim(),
      last_name: document.getElementById("last").value.trim(),
      email: document.getElementById("email").value.trim(),
      phone: document.getElementById("phone").value.trim()
    };

    if (!fields.first_name || !fields.last_name) {
      alert("⚠️ First and Last names are required.");
      return;
    }

    const url = editingId ? `${API_URL}/update/${editingId}` : `${API_URL}/add`;
    const method = editingId ? "PUT" : "POST";

    try {
      btn.disabled = true;
      btn.innerText = "Processing...";

      const response = await fetch(url, {
        method: method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(fields)
      });

      if (response.ok) {
        btn.innerText = "✅ Done!";
        // Short delay to show the success message before resetting
        setTimeout(() => {
          resetForm();
          loadContacts();
        }, 800);
      }
    } catch (err) {
      console.error("Submit Error:", err);
      btn.innerText = "Error!";
      setTimeout(() => resetForm(), 2000);
    }
  }

  // Loads contacts and applies search highlighting
  async function loadContacts() {
    const list = document.getElementById("list");
    const searchKeyword = document.getElementById("search").value.trim().toLowerCase();
    
    try {
      const res = await fetch(`${API_URL}/contacts`);
      const data = await res.json();
      list.innerHTML = "";

      const filtered = data.filter(c => 
        (c.first_name + " " + c.last_name).toLowerCase().includes(searchKeyword)
      );

      if (filtered.length === 0) {
        list.innerHTML = `<div class="status-msg">No contacts found matching your search.</div>`;
        return;
      }

      filtered.forEach(c => {
        const emailValue = c.email || '—';
        const phoneValue = c.phone_number || '—';
        
        // --- Search Highlighting ---
        const fullName = `${c.first_name} ${c.last_name}`;
        let displayName = fullName;

        if (searchKeyword !== "") {
          const regex = new RegExp(`(${searchKeyword})`, "gi");
          displayName = fullName.replace(regex, "<mark>$1</mark>");
        }

        list.innerHTML += `
          <div class="contact-card">
            <div class="actions">
              <button class="icon-btn edit-btn" onclick="prepareEdit(${c.contact_id}, '${c.first_name}', '${c.last_name}', '${emailValue}', '${phoneValue}')">Edit</button>
              <button class="icon-btn del-btn" onclick="deleteContact(${c.contact_id})">Delete</button>
            </div>
            <span class="name">${displayName}</span>
            <div class="details">
              📧 ${emailValue} <br>
              📞 ${phoneValue}
            </div>
          </div>
        `;
      });
    } catch (err) {
      list.innerHTML = `<div class="status-msg">❌ Unable to connect to server.</div>`;
    }
  }

  // Fills form with data for editing
  function prepareEdit(id, first, last, email, phone) {
    editingId = id;
    document.getElementById("first").value = first;
    document.getElementById("last").value = last;
    document.getElementById("email").value = email === '—' ? '' : email;
    document.getElementById("phone").value = phone === '—' ? '' : phone;

    document.getElementById("formTitle").innerText = "Edit Contact";
    const btn = document.getElementById("submitBtn");
    btn.innerText = "Update Contact";
    btn.style.backgroundColor = "var(--warning)";

    if (!document.getElementById("cancelBtn")) {
      const cancel = document.createElement("button");
      cancel.id = "cancelBtn";
      cancel.className = "btn cancel-btn";
      cancel.innerText = "Cancel Edit";
      cancel.onclick = resetForm;
      document.getElementById("cancelArea").appendChild(cancel);
    }
    // Scroll back to top to see the form
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Resets the form to "Add Mode"
  function resetForm() {
    editingId = null;
    document.getElementById("first").value = "";
    document.getElementById("last").value = "";
    document.getElementById("email").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("formTitle").innerText = "New Contact";
    
    const btn = document.getElementById("submitBtn");
    btn.disabled = false;
    btn.innerText = "Add Contact";
    btn.style.backgroundColor = "var(--primary)";
    
    const cancel = document.getElementById("cancelBtn");
    if (cancel) cancel.remove();
  }

  // Handles deletion
  async function deleteContact(id) {
    if (confirm("Are you sure you want to delete this contact?")) {
      try {
        await fetch(`${API_URL}/delete/${id}`, { method: "DELETE" });
        loadContacts();
      } catch (err) {
        alert("Deletion failed.");
      }
    }
  }

  // Load contacts on startup
  loadContacts();
</script>

</body>
</html>
